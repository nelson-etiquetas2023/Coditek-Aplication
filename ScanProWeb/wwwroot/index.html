<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODIXLABELS</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="_content/Blazor.Bootstrap/blazor.bootstrap.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ScanProWeb.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>
    <script>
        window.initLogoDropZone = (dotNetRef) => {
            const zone = document.getElementById('dropZoneLogo');
            if (!zone) return;

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                zone.classList.remove('dragover');

                const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                if (!file) return;

                if (!/^image\//i.test(file.type)) {
                    dotNetRef.invokeMethodAsync('OnInvalidFileDropped');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const result = ev.target.result || '';
                    const base64 = result.indexOf(',') >= 0 ? result.split(',')[1] : result;
                    dotNetRef.invokeMethodAsync('OnLogoDropped', file.name, file.type || 'image/png', base64);
                };
                reader.readAsDataURL(file);
            });
        };

        window.getCurrentLocation = (dotNetRef) => {
            if (!navigator.geolocation) {
                alert('Tu navegador no soporta geolocalización.');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    dotNetRef.invokeMethodAsync('OnLocationReceived', position.coords.latitude, position.coords.longitude);
                },
                (error) => {
                    alert('No se pudo obtener la ubicación: ' + error.message);
                }
            );
        };

        window.downloadFile = (filename, base64) => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = "data:application/octet-stream;base64," + base64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
